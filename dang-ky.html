      <h1>Đăng ký tài khoản</h1>
      <p class="lede">Tạo tài khoản để lưu lịch sử tham quan, nhận thông tin sự kiện và khám phá nhiều nội dung hấp dẫn
        từ bảo tàng.</p>

      <div class="divider">
        <span class="line"></span>
        <svg viewBox="0 0 20 20">
          <use xlink:href="#star" />
        </svg>
        <span class="line right"></span>
      </div>

      <form id="registerForm" novalidate>
        <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

        <div class="field">
          <label for="fullname">Họ và tên <span class="req">*</span></label>
          <div class="input-shell" id="fullnameShell">
            <span class="icon-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21a8 8 0 0 0-16 0" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input id="fullname" type="text" placeholder="Nhập họ và tên của bạn" required>
          </div>
        </div>

        <div class="field">
          <label for="dob">Ngày sinh <span class="req">*</span></label>
          <div class="input-shell" id="dobShell">
            <span class="icon-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M16 2v4M8 2v4M3 10h18" />
              </svg>
            </span>
            <input id="dob" type="date" required placeholder="DD/MM/YYYY">
            <button type="button" class="calendar-toggle" id="calendarBtn" aria-label="Chọn ngày sinh">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                width="19" height="19">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M16 2v4M8 2v4M3 10h18" />
                <circle cx="8" cy="15" r="1" fill="currentColor" stroke="none" />
                <circle cx="12" cy="15" r="1" fill="currentColor" stroke="none" />
                <circle cx="16" cy="15" r="1" fill="currentColor" stroke="none" />
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label>Giới tính <span class="req">*</span></label>
          <div class="gender-row" id="genderShell">
            <span class="icon-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="7" cy="5" r="2" />
                <path d="M7 8v5" />
                <path d="M4.5 11h5" />
                <path d="M7 13 4.5 19" />
                <path d="M7 13 9.5 19" />
                <circle cx="17" cy="5" r="2" />
                <path d="M13.5 16 17 8 20.5 16Z" />
              </svg>
            </span>
            <div class="gender-options">
              <label class="radio-opt"><input type="radio" name="gender" value="nam" checked>Nam</label>
              <label class="radio-opt"><input type="radio" name="gender" value="nu">Nữ</label>
              <label class="radio-opt"><input type="radio" name="gender" value="khac">Khác</label>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="phone">Số di động <span class="req">*</span></label>
          <div class="input-shell" id="phoneShell">
            <span class="icon-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.95.36 1.88.68 2.78a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.32 1.83.55 2.78.68A2 2 0 0 1 22 16.92z" />
              </svg>
            </span>
            <input id="phone" type="tel" placeholder="Nhập số điện thoại" required>
          </div>
        </div>

        <div class="field">
          <label for="email">Email <span class="req">*</span></label>
          <div class="input-shell" id="emailShell">
            <span class="icon-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="m2 7 10 6 10-6" />
              </svg>
            </span>
            <input id="email" type="email" placeholder="Nhập email của bạn" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Mật khẩu <span class="req">*</span></label>
          <div class="input-shell" id="passwordShell">
            <span class="icon-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input id="password" type="password"
              placeholder="Tối thiểu 8 ký tự, bao gồm chữ hoa, chữ thường, số, ký tự đặc biệt" required minlength="8">
            <button type="button" class="toggle" id="togglePw" aria-label="Hiện mật khẩu">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                width="19" height="19">
                <path d="m2 2 20 20" />
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path d="M6.6 6.6C3.8 8.4 2 12 2 12s3 7 10 7c1.9 0 3.5-.5 4.9-1.3" />
                <path d="M17.9 17.9C20.6 16 22 12 22 12s-3-7-10-7c-.6 0-1.2.05-1.8.15" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit">
          <span class="submit-label">TẠO TÀI KHOẢN</span>
          <svg class="submit-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="m13 6 6 6-6 6" />
          </svg>
          <span class="submit-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="footer-note">
        Đã có tài khoản?
        <a href="dangnhap.html">Đăng nhập ngay →</a>
      </div>

    </div>
  </div>
