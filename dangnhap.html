<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập tài khoản — Bảo tàng Lịch sử</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dangnhap.css">
</head>
<body>

<svg width="0" height="0">
  <defs>
    <polygon id="star" points="10,0 12.9,6.9 20,7.6 14.5,12.6 16.2,19.6 10,15.8 3.8,19.6 5.5,12.6 0,7.6 7.1,6.9" fill="var(--gold-400)"/>
  </defs>
</svg>

<div class="wrap">
  <div class="card">

    <div class="brand">
      <div class="icon">
      </div>
      <div class="brand-text">
        <div class="name">BẢO TÀNG LỊCH SỬ</div>
        <div class="tag">Hành trình quá khứ – Kiến tạo tương lai</div>
      </div>
    </div>

    <h1>ĐĂNG NHẬP TÀI KHOẢN</h1>
    <p class="lede">Trải nghiệm không gian trưng bày hiện đại, khám phá những giá trị văn hóa – lịch sử quý báu của dân tộc Việt Nam.</p>

    <div class="divider">
      <span class="line"></span>
      <svg viewBox="0 0 20 20"><use xlink:href="#star"/></svg>
      <span class="line right"></span>
    </div>

    <form id="loginForm" novalidate>
      <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

      <div class="field">
        <div class="input-shell" id="identifierShell">
          <span class="icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/>
            </svg>
          </span>
          <input id="identifier" type="text" placeholder="Email hoặc số điện thoại" required>
        </div>
      </div>

      <div class="field">
        <div class="input-shell" id="passwordShell">
          <span class="icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input id="password" type="password" placeholder="Mật khẩu" required>
          <button type="button" class="toggle" id="togglePw" aria-label="Hiện mật khẩu">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
              <path d="m2 2 20 20"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
              <path d="M6.6 6.6C3.8 8.4 2 12 2 12s3 7 10 7c1.9 0 3.5-.5 4.9-1.3"/>
              <path d="M17.9 17.9C20.6 16 22 12 22 12s-3-7-10-7c-.6 0-1.2.05-1.8.15"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot-row">
        <a href="#" class="forgot-link">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="submit">
        <span class="submit-label">ĐĂNG NHẬP</span>
        <svg class="submit-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        <span class="submit-spinner" aria-hidden="true"></span>
      </button>

    </form>

    <div class="or-divider">
      <span>Hoặc đăng nhập bằng</span>
    </div>

    <div class="social-row">
      <button type="button" class="social-btn">
        <svg viewBox="0 0 48 48" width="20" height="20">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.8 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5 12.9 4.5 4 13.4 4 24.5s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z"/>
          <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5c-7.7 0-14.4 4.4-17.7 10.2z"/>
          <path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.6 26.9 36.5 24 36.5c-5.3 0-9.8-3.4-11.4-8.1l-6.6 5.1C9.5 40 16.2 44.5 24 44.5z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.6 5.6C41.2 36 44 31 44 24.5c0-1.3-.1-2.7-.4-4z"/>
        </svg>
        Google
      </button>
      <button type="button" class="social-btn">
        <svg viewBox="0 0 384 512" width="17" height="21" fill="#111">
          <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
        </svg>
        Apple
      </button>
    </div>

    <div class="footer-note">
      Chưa có tài khoản?
      <a href="dang-ky.html">Đăng ký ngay →</a>
    </div>

  </div>
</div>

<script src="dangnhap.js"></script>
</body>
</html>
